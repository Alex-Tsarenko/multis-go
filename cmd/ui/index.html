<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multis.Agent</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Multis.Agent</h1>
            <div class="controls">
                <input type="text" id="model" placeholder="Model (e.g., qwen3.5:4b)" list="model-list" />
                <datalist id="model-list">
                    <option value="deepseek-chat">deepseek-chat</option>
                    <option value="deepseek-reasoner">deepseek-reasoner</option>
                    <option value="llama3.2">llama3.2</option>
                    <option value="qwen2.5">qwen2.5</option>
                    <option value="qwen3.5:4b">qwen3.5:4b</option>
                </datalist>
                <input type="text" id="workspace" placeholder="Workspace" value="." />
                <select id="securityMode" title="Security Mode">
                    <option value="default">Security: default</option>
                    <option value="ask">Security: ask</option>
                    <option value="auto">Security: auto</option>
                </select>
                <button id="createSession">New Session</button>
            </div>
        </header>

        <main>
            <div id="chat" class="chat"></div>
            <div class="input-area">
                <input list="history-list" id="message" placeholder="Enter your message... (use arrow down for history)" autocomplete="off" />
                <datalist id="history-list"></datalist>
                <button id="actionBtn">Send</button>
            </div>
        </main>

        <footer>
            <span id="status">Ready</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
